[package]
name = "tree-sitter-java-orchard"
description = "Java grammar for tree-sitter"
version = "0.5.23"
authors = ["Ayman Nadeem <aymannadeem@github.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "java-orchard"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://codeberg.org/grammar-orchard/tree-sitter-java-orchard"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.12"
